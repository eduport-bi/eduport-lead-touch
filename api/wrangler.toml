# Cloudflare Worker: serves /api/* and the built React app (Workers Static Assets).
# One deploy = API + frontend:  cd web && npm run build && cd ../api && npx wrangler deploy
name = "leadtouch"   # renamed from eduport-lead-touch on 2026-11-03: https://leadtouch.eduportbi.workers.dev
account_id = "ee558dc2a8ca2f421731d9b046ae5731"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Custom domain (planned 2026-11-03): leads.eduport.ai -----------------------------------------------------------------
# eduport.ai is already on Cloudflare (nameservers dina/brodie.ns.cloudflare.com) but in ANOTHER Cloudflare account; a Worker custom
# domain must live in the account that holds the zone. Steps, in order:
#   1. The owner of that Cloudflare account invites vishnudasp.eduport@gmail.com as a member (Administrator, or Workers Admin + DNS).
#   2. Set account_id below to that account (npx wrangler whoami lists it), create the KV namespace and the Hyperdrive config there
#      (npx wrangler kv namespace create CACHE; npx wrangler hyperdrive create eduport-lead-touch --connection-string "<Supabase string>")
#      and paste the two new ids into [[kv_namespaces]] / [[hyperdrive]]; re-enter the Worker secrets (GITHUB_TOKEN, SMTP_USER, SMTP_PASS,
#      WARM_SECRET) with npx wrangler secret put.
#   3. Uncomment the route below and deploy: wrangler creates the DNS record and the certificate itself.
#   4. Point the warm-up URLs at the new host (api/scripts/deploy.mjs SITE_URL default, .github/workflows/sync.yml), tell the users,
#      then delete the old Worker in the personal account (npx wrangler delete --name eduport-lead-touch).
# routes = [{ pattern = "leads.eduport.ai", custom_domain = true }]

[observability]
enabled = true

# --- Frontend (built by `npm run build` in ../web) ---------------------------
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# --- Database ------------------------------------------------------------------
# Set once as a Worker secret (never in this file):
#   npx wrangler secret put DATABASE_URL
#   -> paste the Supabase TRANSACTION pooler string (port 6543):
#      postgresql://postgres.PROJECT_REF:PASSWORD@aws-0-REGION.pooler.supabase.com:6543/postgres?sslmode=require
# Optional later: a Hyperdrive binding named HYPERDRIVE takes precedence when present.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "c6890bf7a94c409e88a2fbcb42ee9bf6"

# --- Response cache (api/src/cache.ts): answers keyed on the data version; shared across isolates through KV
[[kv_namespaces]]
binding = "CACHE"
id = "cdb9b0b1bde44c7f90613ea02870a1c5"

# --- Materialized-view refresh is done by the sync job (GitHub Actions), never by the Worker: a refresh through
# the pooled connection can be cut mid-transaction and leave the views locked. The Worker cron only WARMS the
# response cache (default views of every page) so the first visitor after a sync does not wait for the database.
[triggers]
crons = ["*/10 * * * *"]

# --- Non-secret config ---------------------------------------------------------
[vars]
AUTH_MODE = "password"                                        # "password" (login page, accounts managed in the app) | "none" (no login)
PUBLIC_ROLE = "analyst"                                       # only with AUTH_MODE=none: "viewer" masks name/phone/email, "analyst" shows them, "admin" also unlocks admin actions
SUPABASE_URL = "https://duotauyrrxjmqpzdjtph.supabase.co"     # Project URL (Supabase -> Project Settings -> API)
ADMIN_EMAILS = "bi_team@eduport.ai"                           # comma list: e-mails allowed to create the FIRST admin account (setup screen); afterwards admins are managed on the Access page
GITHUB_REPO = "eduport-bi/eduport-lead-touch"           # manual "Sync now" button; token via: npx wrangler secret put GITHUB_TOKEN
APP_VERSION = "1.0.0"
EXPORT_ROW_CAP = "50000"
# Account e-mails (new account / password set): sent from a Google mailbox over SMTP. Secrets: npx wrangler secret put SMTP_USER (the mailbox,
# e.g. bi_team@eduport.ai) and SMTP_PASS (a Google App Password). Alternative: RESEND_API_KEY secret + MAIL_FROM = "Name <addr@verified-domain>".
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
MAIL_FROM_NAME = "Eduport Lead Touch"

# Local dev overrides live in .dev.vars (git-ignored), e.g. AUTH_MODE=dev, DATABASE_URL=...
