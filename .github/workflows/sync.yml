# Salesforce + production DB -> Supabase, once a day (06:00 IST, started by the Worker cron), then refresh the MVs.
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   SF_CLIENT_ID, SF_CLIENT_SECRET, SF_LOGIN_URL, DATABASE_URL, SOURCE_DATABASE_URL
# Manual runs: Actions -> "sync" -> Run workflow (tick "full" for a full reload).
name: sync
on:
  # ONE sync a day (user rule 2026-11-25): the Worker's cron dispatches this workflow at 06:00 IST (api/src/routes/sync.ts dailySync,
  # retried at 06:10 / 06:20 when the dispatch fails; needs the Worker secret GITHUB_TOKEN). The 21:30 IST fallback schedule was removed:
  # every extra run emptied the dashboard's cache and slowed it for the 5-minute refresh. "Sync now" (admins) for an intraday refresh.
  workflow_dispatch:
    inputs:
      full:
        description: 'Full reload (ignore watermarks)'
        type: boolean
        default: false
      objects:
        description: 'Comma list to restrict (blank = all)'
        type: string
        default: ''
      nightly:
        description: 'The 06:00 run (set by the Worker): also reorders the hot views and compacts; a manual Sync now leaves it off'
        type: boolean
        default: false
      sql:
        description: 'Ops only: run this SQL against the analytics DB instead of syncing'
        type: string
        default: ''
      target:
        description: 'Ops only: which DB the SQL runs on'
        type: choice
        options: [supabase, source]
        default: supabase
concurrency:
  group: lead-touch-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run: { working-directory: sync }
    env:
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL || 'https://login.salesforce.com' }}
      SF_MY_DOMAIN: ${{ vars.SF_MY_DOMAIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      UJRA_DATABASE_URL: ${{ secrets.UJRA_DATABASE_URL }}
      METABASE_URL: ${{ secrets.METABASE_URL }}
      METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
      LEAD_SINCE: ${{ vars.LEAD_SINCE || '2025-04-01T00:00:00Z' }}
      CALLS_SINCE: ${{ vars.CALLS_SINCE || '' }}
      STAGE_HISTORY_SINCE: ${{ vars.STAGE_HISTORY_SINCE || '' }}
      TASK_SINCE: ${{ vars.TASK_SINCE || '2026-01-01T00:00:00Z' }}
      SYNC_OBJECTS: ${{ inputs.objects }}
      SKIP_OBJECTS: ${{ vars.SKIP_OBJECTS }}
      NIGHTLY_RUN: ${{ inputs.nightly }}
      CALLYZER_API_KEY: ${{ secrets.CALLYZER_API_KEY }}
      WARM_SECRET: ${{ secrets.WARM_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sync/package-lock.json }
      - run: npm ci
      - name: Ad-hoc SQL (ops)
        if: inputs.sql != ''
        env:
          ADHOC_SQL: ${{ inputs.sql }}
          ADHOC_TARGET: ${{ inputs.target }}
        run: npx tsx src/query.ts
      - name: Sync
        if: inputs.sql == ''
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then npm run sync:full; else npm run sync; fi
      - name: Warm the dashboard cache
        # a sync changes the data version, which empties the response cache: fill the default views before anyone opens the page
        if: inputs.sql == '' && env.WARM_SECRET != ''
        run: |
          curl -sS -m 600 -o /dev/null -w "warm HTTP %{http_code} in %{time_total}s\n" -X POST -H "x-warm-secret: $WARM_SECRET" https://leadtouch.eduportbi.workers.dev/api/admin/warm || true
